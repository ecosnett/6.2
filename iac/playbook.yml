- name: Configure Linux VM for C# App
  hosts: all
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install prerequisites for adding Microsoft repository
      apt:
        name:
          - wget
          - apt-transport-https
          - software-properties-common
        state: present

    - name: Add Microsoft package repository key
      shell: |
        wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft.gpg
      args:
        creates: /usr/share/keyrings/microsoft.gpg

    - name: Add Microsoft repository for Ubuntu Focal
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/20.04/prod focal main"
        state: present

    - name: Update apt cache after adding repository
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Install .NET SDK
      apt:
        name: dotnet-sdk-6.0
        state: present

    - name: Add Docker group to admin user
      user:
        name: adminuser
        groups: docker
        append: yes
